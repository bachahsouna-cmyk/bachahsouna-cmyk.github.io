<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>التدخل السريع - بلدية نابل</title>
<style>
:root{--bg:#f3f6f8;--card:#fff;--tx:#18222e;--mu:#65717e;--pr:#2f8a45;--ac:#c8592b;--red:#d91e2a;--bd:#dbe2e9;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10171f;--card:#1a2430;--tx:#eef2f6;--mu:#9aa8b6;--bd:#2c3949;--pr:#5cc27a}}
:root[data-theme="dark"]{--bg:#10171f;--card:#1a2430;--tx:#eef2f6;--mu:#9aa8b6;--bd:#2c3949;--pr:#5cc27a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;line-height:1.5}
header{position:relative;height:190px;overflow:hidden;text-align:center;border-bottom:4px solid var(--ac)}header svg.bg{position:absolute;inset:0;width:100%;height:100%}header .tx{position:relative;display:inline-block;margin-top:18px;background:rgba(255,255,255,.9);color:#12402a;padding:8px 20px;border-radius:14px}header .tx h1{margin:0;font-size:21px}header .tx p{margin:2px 0 0;font-size:13px}header svg.j{width:26px;height:31px;vertical-align:middle}
nav{display:flex;gap:8px;padding:10px 12px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
nav button{flex:1;padding:11px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;font-size:15px;font-weight:600}
nav button.on{background:var(--pr);color:#fff;border-color:var(--pr)}
main{max-width:640px;margin:0 auto;padding:0 12px 40px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
.cats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0 12px}
.cats button{padding:14px 6px;border:2px solid var(--bd);background:var(--card);color:var(--tx);border-radius:12px;font-size:15px}
.cats button.on{border-color:var(--pr);background:color-mix(in srgb,var(--pr) 14%,var(--card));font-weight:700}
label.lb{display:block;font-weight:600;margin:10px 0 4px}
input[type=text],input[type=password],textarea{width:100%;padding:11px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}
.btn{display:block;width:100%;padding:13px;border:0;border-radius:11px;background:var(--pr);color:#fff;font-size:16px;font-weight:700;text-align:center;margin-top:10px}
.btn.sec{background:var(--card);color:var(--tx);border:1px solid var(--bd)}
.btn:disabled{opacity:.5}
.prev{width:100%;max-height:260px;object-fit:cover;border-radius:10px;margin-top:8px}
.ok{background:#e6f6ee;color:#0a5a3a;padding:12px;border-radius:10px;margin-top:10px;font-weight:600}
.ban{background:var(--red);color:#fff;padding:14px;border-radius:12px;text-align:center;font-weight:800;font-size:18px;margin-bottom:12px;animation:blink 1s infinite}
@keyframes blink{50%{background:#7d0f16}}
.r{border:3px solid var(--bd)}
.r.open{border-color:var(--red);animation:pulse 1s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(217,30,42,.35)}}
.r.done{border-color:#1f9d6b}
.tag{display:inline-block;padding:2px 10px;border-radius:99px;font-size:13px;font-weight:700;color:#fff}
.t-open{background:var(--red)}.t-done{background:#1f9d6b}
.meta{color:var(--mu);font-size:13px;margin:4px 0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.two figure{margin:0}.two img{width:100%;height:150px;object-fit:cover;border-radius:8px}
.two figcaption{font-size:12px;color:var(--mu);text-align:center}
img.one{width:100%;max-height:240px;object-fit:cover;border-radius:10px;margin:6px 0}
a{color:var(--pr)}
.hide{display:none}
</style></head>
<body>
<header><svg class="bg" viewBox="0 0 400 190" preserveAspectRatio="xMidYMax slice" aria-hidden="true"><defs><linearGradient id="sk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8fd3f4"/><stop offset="1" stop-color="#eaf8ff"/></linearGradient>
<g id="fp"><line y2="16" stroke="#2f7d3a" stroke-width="1.6"/><g fill="#ff6b8b"><circle cy="-3.5" r="3.2"/><circle cx="3.5" r="3.2"/><circle cx="-3.5" r="3.2"/><circle cy="3.5" r="3.2"/></g><circle r="2" fill="#ffd54a"/></g>
<g id="fj"><line y2="16" stroke="#2f7d3a" stroke-width="1.6"/><g fill="#fff" stroke="#d9d9d9" stroke-width=".4"><circle cy="-3.5" r="3.2"/><circle cx="3.5" r="3.2"/><circle cx="-3.5" r="3.2"/><circle cy="3.5" r="3.2"/></g><circle r="1.6" fill="#f5c542"/></g>
<g id="fy"><line y2="16" stroke="#2f7d3a" stroke-width="1.6"/><g fill="#ffc21a"><circle cy="-3.5" r="3.2"/><circle cx="3.5" r="3.2"/><circle cx="-3.5" r="3.2"/><circle cy="3.5" r="3.2"/></g><circle r="2" fill="#c8592b"/></g>
<path id="gr" d="M0 0L-4-16L1-6L3-18L6-5L10-14L9 0Z" fill="#2b7a38"/></defs>
<rect width="400" height="190" fill="url(#sk)"/><circle cx="340" cy="46" r="24" fill="#ffd54a"/><ellipse cx="80" cy="40" rx="30" ry="9" fill="#fff" opacity=".85"/><ellipse cx="105" cy="34" rx="20" ry="8" fill="#fff" opacity=".85"/>
<path d="M0 120Q100 85 200 112T400 100V190H0z" fill="#79c463"/><path d="M0 140Q120 115 240 140T400 130V190H0z" fill="#3f9e4a"/><path d="M0 162Q150 148 400 160V190H0z" fill="#2f8a45"/><use href="#gr" x="5" y="172"/><use href="#gr" x="43" y="172"/><use href="#gr" x="81" y="172"/><use href="#gr" x="119" y="172"/><use href="#gr" x="157" y="172"/><use href="#gr" x="195" y="172"/><use href="#gr" x="233" y="172"/><use href="#gr" x="271" y="172"/><use href="#gr" x="309" y="172"/><use href="#gr" x="347" y="172"/><use href="#gr" x="385" y="172"/><use href="#fp" transform="translate(30 150) scale(1)"/><use href="#fj" transform="translate(70 158) scale(1.2)"/><use href="#fy" transform="translate(112 152) scale(1)"/><use href="#fp" transform="translate(150 160) scale(1.3)"/><use href="#fj" transform="translate(205 154) scale(1)"/><use href="#fy" transform="translate(250 160) scale(1.2)"/><use href="#fp" transform="translate(292 152) scale(1)"/><use href="#fj" transform="translate(335 158) scale(1.3)"/><use href="#fy" transform="translate(372 150) scale(1)"/><use href="#fp" transform="translate(180 166) scale(0.9)"/><use href="#fj" transform="translate(52 168) scale(0.9)"/><use href="#fy" transform="translate(318 168) scale(0.9)"/></svg>
<div class="tx"><h1><svg class="j" viewBox="0 0 40 48"><path d="M14 4h12v4c0 2 6 4 6 14 0 12-6 20-12 20S8 34 8 22c0-10 6-12 6-14z" fill="#c8592b"/><path d="M10 20h20M9.5 27h21" stroke="#fff" stroke-width="2"/></svg> التدخل السريع</h1><p>بلدية نابل · مدينة الفخار والياسمين</p></div></header>
<nav><button id="nc" class="on">👤 مواطن</button><button id="na">🛠️ فريق التدخل <span id="cnt"></span></button></nav>
<main>
<section id="citizen">
 <div class="card">
  <b>شنوة المشكل؟</b>
  <div class="cats" id="cats"></div>
  <label class="lb">📷 صورة (إجبارية)</label>
  <input type="file" id="ph" accept="image/*" capture="environment">
  <img id="pv" class="prev hide" alt="">
  <label class="lb">📍 الموقع</label>
  <input type="text" id="pl" placeholder="الحي / الشارع / علامة قريبة">
  <button class="btn sec" id="gps" type="button">📍 حدد موقعي الحالي</button>
  <div id="gpsok" class="meta"></div>
  <label class="lb">👤 الاسم واللقب (اختياري)</label><input type="text" id="nm" autocomplete="name">
  <label class="lb">📞 رقم الهاتف (اختياري)</label><input type="text" id="ph2" inputmode="tel" placeholder="مثال: 22 123 456">
  <div class="meta">يستعمل فقط للتواصل معاك بخصوص الشكاية.</div>
  <label class="lb">ملاحظة (اختياري)</label>
  <textarea id="nt" rows="2"></textarea>
  <button class="btn" id="send">إرسال الشكاية</button>
  <div id="done" class="ok hide">✅ توصلنا بشكايتك وفريق التدخل السريع باش يتحرك. شكرا!</div>
 </div>
</section>
<section id="agent" class="hide">
 <div id="gate" class="card"></div>
 <div id="panel" class="hide">
  <div id="adm" class="card hide"></div>
  <button class="btn sec" id="snd" style="margin-top:0;margin-bottom:12px">🔔 تفعيل صوت التنبيه</button>
  <div id="ban"></div>
  <div id="list"></div>
 </div>
</section>
</main>
<script>
const CATS={waste:"🗑️ فضلات منزلية",light:"💡 عطب إنارة الشارع",debris:"🧱 فضلات البناء",tree:"🌳 أشجار"};
let user=null,isAdmin=false,cfg=null,unlocked=false,db=null,reports=[],cat="waste",photo=null,loc=null,mode="c",sound=false,ac=null,tick=0;
async function sha(t){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(t));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
const $=s=>document.querySelector(s);
const esc=s=>{const d=document.createElement("div");d.textContent=s||"";return d.innerHTML};
const fmt=t=>new Date(t).toLocaleString("fr-FR",{dateStyle:"short",timeStyle:"short"});
const dur=ms=>{const m=Math.max(1,Math.round(ms/60000));return m<60?m+" دقيقة":Math.floor(m/60)+" س و "+(m%60)+" د"};
function shrink(f){return new Promise((ok,ko)=>{const i=new Image(),u=URL.createObjectURL(f);i.onload=()=>{const k=Math.min(1,720/Math.max(i.width,i.height)),c=document.createElement("canvas");c.width=i.width*k;c.height=i.height*k;c.getContext("2d").drawImage(i,0,0,c.width,c.height);URL.revokeObjectURL(u);ok(c.toDataURL("image/jpeg",.6))};i.onerror=ko;i.src=u})}
function drawCats(){$("#cats").innerHTML=Object.entries(CATS).map(([k,v])=>`<button type="button" data-k="${k}" class="${k===cat?"on":""}">${v}</button>`).join("")}
$("#cats").onclick=e=>{const k=e.target.dataset.k;if(k){cat=k;drawCats()}};
drawCats();
$("#ph").onchange=async e=>{const f=e.target.files[0];if(!f)return;try{photo=await shrink(f);$("#pv").src=photo;$("#pv").classList.remove("hide")}catch(_){}};
$("#gps").onclick=()=>{navigator.geolocation?.getCurrentPosition(p=>{loc={lat:p.coords.latitude,lng:p.coords.longitude};$("#gpsok").textContent="✅ تم تحديد الموقع"},()=>{$("#gpsok").textContent="ما نجمناش نحددو الموقع، اكتب العنوان"})};
$("#send").onclick=async()=>{
 if(!photo){alert("لازم تزيد صورة");return}
 const id="r"+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
 const d={cat,place:$("#pl").value.trim(),note:$("#nt").value.trim(),name:$("#nm").value.trim(),phone:$("#ph2").value.trim(),lat:loc?loc.lat:null,lng:loc?loc.lng:null,photo,created:Date.now(),status:"open"};
 $("#send").disabled=true;
 try{if(db)await db.doc("reports/"+id).set(d);else{reports.push({id,...d});renderList()}
  $("#done").classList.remove("hide");photo=null;loc=null;$("#pv").classList.add("hide");$("#ph").value="";$("#pl").value="";$("#nt").value="";$("#nm").value="";$("#ph2").value="";$("#gpsok").textContent=""}
 catch(e){alert("صار مشكل في الإرسال، عاود جرب")}
 $("#send").disabled=false};
function setMode(m){mode=m;$("#citizen").classList.toggle("hide",m!=="c");$("#agent").classList.toggle("hide",m!=="a");$("#nc").classList.toggle("on",m==="c");$("#na").classList.toggle("on",m==="a");if(m==="a"){drawGate();renderList()}}
$("#nc").onclick=()=>setMode("c");$("#na").onclick=()=>setMode("a");
$("#snd").onclick=()=>{try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();ac.resume();sound=true;$("#snd").textContent="🔔 الصوت مفعّل";beep()}catch(_){}};
function beep(){if(!sound||!ac)return;const o=ac.createOscillator(),g=ac.createGain();o.type="square";o.frequency.value=(tick++%2)?660:920;g.gain.value=.25;o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+.35)}
setInterval(()=>{if(mode==="a"&&reports.some(r=>r.status==="open")){beep();try{navigator.vibrate&&navigator.vibrate([300,150,300])}catch(_){}}},1500);
async function finish(id,f){if(!f)return;try{const a=await shrink(f),p={status:"done",after:a,doneAt:Date.now()};if(db)await db.doc("reports/"+id).update(p);else{Object.assign(reports.find(r=>r.id===id),p);renderList()}}catch(e){alert("صار مشكل، عاود جرب")}}
function renderList(){
 const open=reports.filter(r=>r.status==="open").length;
 $("#cnt").textContent=open?"("+open+")":"";
 $("#ban").innerHTML=open?`<div class="ban">🚨 ${open} تدخل في الانتظار</div>`:"";
 const s=[...reports].sort((a,b)=>(a.status==="open"?0:1)-(b.status==="open"?0:1)||(a.status==="open"?a.created-b.created:b.doneAt-a.doneAt));
 $("#list").innerHTML=s.length?s.map(r=>{
  const del=isAdmin?`<button class="btn sec" data-del="${r.id}">🗑️ حذف الشكاية</button>`:"";
  const map=r.lat!=null?` · <a target="_blank" rel="noopener" href="https://www.google.com/maps?q=${r.lat},${r.lng}">الخريطة</a>`:"";
  const head=`<span class="tag ${r.status==="open"?"t-open":"t-done"}">${r.status==="open"?"في الانتظار":"تم التدخل"}</span> <b>${CATS[r.cat]||""}</b>
   <div class="meta">📍 ${esc(r.place)||"—"}${map}<br>🕐 وصلت: ${fmt(r.created)}</div>${r.name||r.phone?`<div class="meta">👤 ${esc(r.name)}${r.phone?` · 📞 <a href="tel:${(r.phone||"").replace(/[^\d+]/g,"")}">${esc(r.phone)}</a>`:""}</div>`:""}${r.note?`<div>${esc(r.note)}</div>`:""}`;
  if(r.status==="open")return`<div class="card r open">${head}<img class="one" src="${r.photo}" alt="">
   <label class="btn" style="background:var(--red)">📷 صورة المكان بعد التنظيف<input type="file" accept="image/*" capture="environment" class="hide" data-id="${r.id}"></label>
   <div class="meta" style="text-align:center">التنبيه يبقى أحمر حتى تحمّل الصورة</div>${del}</div>`;
  return`<div class="card r done">${head}<div class="meta">✅ تم التدخل: ${fmt(r.doneAt)} · المدة: <b>${dur(r.doneAt-r.created)}</b></div>
   <div class="two"><figure><img src="${r.photo}" alt=""><figcaption>قبل</figcaption></figure><figure><img src="${r.after}" alt=""><figcaption>بعد</figcaption></figure></div>${del}</div>`}).join(""):`<div class="card meta" style="text-align:center">ما فما حتى شكاية</div>`}
$("#list").onclick=e=>{const id=e.target.dataset.del;if(id&&db&&confirm("تمسح هذه الشكاية نهائيا؟"))db.doc("reports/"+id).delete().catch(()=>alert("ما نجمتش نمسح"))};
$("#list").onchange=e=>{const id=e.target.dataset.id;if(id)finish(id,e.target.files[0])};
async function drawGate(){
 const ok=unlocked||isAdmin;
 $("#gate").classList.toggle("hide",ok);$("#panel").classList.toggle("hide",!ok);
 if(!ok){
  $("#gate").innerHTML=cfg?`<b>🔒 فضاء أعوان التدخل</b><label class="lb">كلمة سر الفريق</label><input type="password" id="pin" autocomplete="off"><button class="btn" id="go">دخول</button><div id="perr" class="meta" style="color:var(--red)"></div>`:`<b>🔒 فضاء الفريق غير مفعّل بعد</b><div class="meta">المسؤول لازم يحدد كلمة السر أولا.</div>`;
  const g=$("#go");if(g)g.onclick=async()=>{const h=await sha(cfg.salt+$("#pin").value.trim());if(h===cfg.hash){unlocked=true;try{sessionStorage.setItem("nb",h)}catch(_){}drawGate();renderList()}else $("#perr").textContent="كلمة السر غالطة"};
 }
 if(isAdmin){
  $("#adm").classList.remove("hide");
  if(!$("#np"))$("#adm").innerHTML=`<b>🔐 لوحة المسؤول</b><div class="meta">أنت اللي تتحكم: حدد كلمة السر لأعوان التدخل (وتنجم تبدلها وقت ما تحب)، وتنجم تمسح الشكاوى.</div><input type="password" id="np" placeholder="كلمة سر جديدة (6 حروف على الأقل)"><button class="btn" id="sp">حفظ كلمة السر</button><div id="pmsg" class="meta"></div>`;
  $("#pmsg").textContent=cfg?"✅ كلمة السر مفعّلة":"⚠️ ما فماش كلمة سر بعد";
  $("#sp").onclick=async()=>{const v=$("#np").value.trim();if(v.length<6||!db){alert("6 حروف على الأقل");return}const salt=Math.random().toString(36).slice(2)+Date.now().toString(36);try{await db.doc("config/agent").set({salt,hash:await sha(salt+v)});$("#np").value=""}catch(e){alert("ما نجمتش نحفظ")}};
 }
}
(async()=>{
 try{user=await claude.use("user");isAdmin=user?await user.canEdit():false}catch(_){}
 try{db=await claude.use("db");if(db){
  db.collection("reports").onSnapshot(s=>{reports=s.docs.map(d=>({id:d.id,...d.data()}));renderList()},()=>{});
  db.doc("config/agent").onSnapshot(s=>{cfg=s.exists?s.data():null;try{unlocked=!!cfg&&sessionStorage.getItem("nb")===cfg.hash}catch(_){}drawGate();renderList()},()=>{})}}catch(_){db=null}
 drawGate();
})();
</script></body></html>
